name: Bug report
description: Report something that isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** Please follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Blazor web
        - .NET MAUI (Android)
        - .NET MAUI (iOS)
        - .NET MAUI (Windows)
        - .NET MAUI (macOS)
        - API
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
