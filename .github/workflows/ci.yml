name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Dotnet info
        run: dotnet --info
      - name: Docker info
        run: docker info
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore SharpVault.slnx
      - name: Vulnerable packages
        run: |
          dotnet list SharpVault.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - name: Build
        run: dotnet build SharpVault.slnx -c Release --no-restore
      - name: Test
        run: >
          dotnet test SharpVault.slnx -c Release --no-build
          --filter "Category!=Performance"
          --settings tests/coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults
          --logger trx
      - name: Merge coverage
        run: >
          dotnet reportgenerator
          "-reports:TestResults/**/coverage.cobertura.xml"
          "-targetdir:TestResults/coverage"
          "-reporttypes:Cobertura;MarkdownSummaryGithub"
      - name: Coverage summary
        run: cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate
        run: dotnet run eng/CoverageGate.cs -- TestResults/coverage/Cobertura.xml SharpVault.Application=80 SharpVault.Infrastructure=80
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  performance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Performance tests
        run: dotnet test SharpVault.slnx -c Release --filter "Category=Performance"
